<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="14" fill="#090d16" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Predictive Forward Radar Waves -->
  <path d="M42 22 C 48 26, 48 36, 42 40" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 3" opacity="0.85" />
  <path d="M48 16 C 56 22, 56 40, 48 46" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />
  <path d="M54 11 C 64 19, 64 43, 54 51" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" opacity="0.35" />

  <!-- Container Ship Hull -->
  <path d="M10 38 L45 38 L51 32 L46 45 L14 45 Z" fill="url(#hullGrad)" />

  <!-- Cargo Containers on Deck -->
  <!-- Tier 1 -->
  <rect x="15" y="32" width="6" height="5" rx="1" fill="#38bdf8" />
  <rect x="22" y="32" width="6" height="5" rx="1" fill="#818cf8" />
  <rect x="29" y="32" width="6" height="5" rx="1" fill="#34d399" />
  <rect x="36" y="32" width="5" height="5" rx="1" fill="#38bdf8" />

  <!-- Tier 2 -->
  <rect x="17" y="26" width="6" height="5" rx="1" fill="#34d399" />
  <rect x="24" y="26" width="6" height="5" rx="1" fill="#38bdf8" />
  <rect x="31" y="26" width="6" height="5" rx="1" fill="#818cf8" />

  <!-- Bridge / Navigation Tower -->
  <path d="M12 25 L15 25 L15 38 L12 38 Z" fill="#64748b" />
  <rect x="11" y="22" width="4" height="3" rx="0.5" fill="#94a3b8" />
  <line x1="13" y1="18" x2="13" y2="22" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- AI ETA Prediction Pulse Sensor -->
  <circle cx="51" cy="32" r="2.5" fill="#38bdf8" />
  <circle cx="51" cy="32" r="4.5" stroke="#22d3ee" stroke-width="1.2" opacity="0.75" />

  <!-- Ocean Waves -->
  <path d="M7 49 Q 14 46, 21 49 T 35 49 T 49 49 T 57 49" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M10 54 Q 17 51, 24 54 T 38 54 T 52 54" stroke="#0369a1" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Gradients -->
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="hullGrad" x1="10" y1="38" x2="51" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
  </defs>
</svg>
