version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shippredict-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ship_predict.db
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: shippredict-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
